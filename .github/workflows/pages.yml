name: Pages

on:
  push:
    branches: [main]
  # The demo runs the library's main branch; a daily build picks up releases.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the library and the example hub
        run: node scripts/sync-library.mjs --remote
      # Nothing deploys if the demo can't boot the hub.
      - name: Boot the demo
        run: node tests/smoke.mjs
      - uses: actions/configure-pages@v5
      # Only the pages themselves, not the repo's README, scripts or tests.
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html docs.html play.html styles.css site.js favicon.svg img play _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
