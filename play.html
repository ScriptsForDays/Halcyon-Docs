<!doctype html>
<html lang="en" class="no-js">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Try Halcyon in your browser</title>
	<meta name="description" content="The real Halcyon library and its example hub, running in your browser. Click through every control without an executor.">
	<meta name="theme-color" content="#f8f9fb">
	<meta property="og:title" content="Try Halcyon in your browser">
	<meta property="og:description" content="The real Halcyon library and its example hub, running in your browser.">
	<meta property="og:type" content="website">
	<meta property="og:image" content="https://scriptsfordays.github.io/Halcyon-Docs/img/hero.jpg">
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap">
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="play/play.css">
	<script src="site.js" defer></script>
</head>
<body class="play-page">
	<svg width="0" height="0" style="position:absolute" aria-hidden="true">
		<symbol id="i-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14a5 5 0 0 1 10 0"/><path d="M3 14h18"/><path d="M6.5 18h11"/><path d="M10 21.5h4"/><path d="M12 5v2"/><path d="m5.6 7.6 1.4 1.4"/><path d="m18.4 7.6-1.4 1.4"/></symbol>
		<symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
		<symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
		<symbol id="i-github" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></symbol>
		<symbol id="i-reset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
	</svg>

	<a class="skip" href="#stage">Skip to the demo</a>

	<header class="nav">
		<nav class="nav__bar" aria-label="Main">
			<a class="brand" href="./"><svg aria-hidden="true"><use href="#i-mark"/></svg>Halcyon</a>
			<a class="nav__link" href="docs.html">Docs</a>
			<a class="nav__link" href="play.html" aria-current="page">Try it</a>
			<a class="icon-button" href="https://github.com/ScriptsForDays/Halcyon" aria-label="Halcyon on GitHub"><svg aria-hidden="true"><use href="#i-github"/></svg></a>
			<button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="Switch colour theme">
				<svg class="icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
				<svg class="icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
			</button>
		</nav>
	</header>

	<main class="play">
		<div class="play__bar">
			<div>
				<h1 class="play__title">The example hub, in your browser</h1>
				<p class="play__note">This is the real library running, not a recording. Saved configs stay in this browser. Right Shift hides the window.</p>
			</div>
			<button class="button button--quiet" type="button" data-reset><svg aria-hidden="true"><use href="#i-reset"/></svg>Start over</button>
		</div>
		<div class="stage" id="stage" tabindex="-1" aria-label="Halcyon example hub">
			<p class="stage__status" data-status role="status">Loading</p>
		</div>
	</main>

	<script type="module">
		import { boot, resetStore } from "./play/boot.js";

		const stage = document.getElementById("stage");
		const status = document.querySelector("[data-status]");
		document.querySelector("[data-reset]").addEventListener("click", () => {
			resetStore();
			location.reload();
		});
		boot(stage, (text) => {
			status.hidden = text === null;
			if (text) status.textContent = text;
		}).catch((error) => {
			status.hidden = false;
			status.textContent = "The demo couldn't start in this browser. Try a recent Chrome, Edge, Firefox or Safari.";
			console.error(error);
		});
	</script>
</body>
</html>
